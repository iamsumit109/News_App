<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Search App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <a class="logo" href="#" data-category="" aria-label="News home">DAILY NEWS</a>

        <form id="searchform" class="top-search">
            <input
                type="search"
                id="searchinput"
                placeholder="Search for a topic..."
                aria-label="Search news by topic"
            >
            <button type="submit">Search</button>
        </form>

        <nav aria-label="News categories">
            <a class="nav-link active" href="#" data-category="" aria-current="page">Home</a>
            <a class="nav-link" href="#" data-category="technology">Technology</a>
            <a class="nav-link" href="#" data-category="sports">Sports</a>
            <a class="nav-link" href="#" data-category="business">Business</a>
        </nav>
    </header>

    <main class="page-content">

        <p id="msg" role="status" aria-live="polite"></p>
        <section id="result" aria-label="News results"></section>
    </main>

    <script src="script.js"></script>
</body>
</html>
